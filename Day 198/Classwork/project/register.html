<!DOCTYPE html>
<html lang="ka">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>რეგისტრაცია</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="auth-card">
        <h2>ანგარიშის შექმნა</h2>
        <form action="/register" method="POST">
            <div class="form-group">
                <label for="fullname">სრული სახელი</label>
                <input type="text" id="fullname" name="fullname" required placeholder="გიორგი ბერიძე">
            </div>

            <div class="form-group">
                <label for="email">ელ.ფოსტა</label>
                <input type="email" id="email" name="email" required placeholder="example@domain.com">
            </div>

            <div class="form-group">
                <label for="password">პაროლი</label>
                <input type="password" id="password" name="password" required placeholder="••••••••">
            </div>

            <div class="form-group">
                <label for="confirm-password">გაამეორეთ პაროლი</label>
                <input type="password" id="confirm-password" name="confirm_password" required placeholder="••••••••">
            </div>

            <button type="submit" class="btn">რეგისტრაცია</button>
        </form>
        <p class="auth-switch">უკვე გაქვთ ანგარიში? <a href="login.html">შესვლა</a></p>
    </div>
</body>

</html>
