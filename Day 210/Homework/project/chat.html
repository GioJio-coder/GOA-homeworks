<!DOCTYPE html>
<html lang="ka">
<head>
    <meta charset="UTF-8">
    <title>Global Chat</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container mt-4">
        <div class="card shadow-sm">
            <div class="card-header bg-primary text-white d-flex justify-content-between align-items-center">
                <h5 class="mb-0">Global Chat</h5>
                <span class="badge bg-success">Active Users: 1</span>
            </div>
            <div class="card-body chat-box" style="height: 400px; overflow-y: scroll;">
                <!-- შეტყობინებების სია -->
                <div class="mb-3">
                    <strong>aleksandre_dzuka:</strong>
                    <div class="p-2 bg-success text-white rounded d-inline-block">გამარჯობა!</div>
                </div>
            </div>
            <div class="card-footer">
                <form method="POST" class="d-flex">
                    {% csrf_token %}
                    <input type="text" name="message" class="form-control me-2" placeholder="დაწერე შეტყობინება...">
                    <button type="submit" class="btn btn-primary">Send</button>
                </form>
            </div>
        </div>
    </div>
</body>
</html>
