<!DOCTYPE html>
<html lang="ka">
<head>
    <meta charset="UTF-8">
    <title>{{ phone.brand }} {{ phone.model }}</title>
</head>
<body>
    <h1>{{ phone.brand }} {{ phone.model }}</h1>
    
    <p><strong>ფასი:</strong> ${{ phone.price }}</p>
    <p><strong>გამოშვების წელი:</strong> {{ phone.release_year }}</p>
    <p><strong>აღწერა:</strong> {{ phone.description }}</p>

    <hr>

    <!-- წაშლის ფორმა ღილაკით -->
    <form action="{% url 'phone_delete' phone.id %}" method="POST" onsubmit="return confirm('ნამდვილად გსურთ წაშლა?');">
        {% csrf_token %}
        <button type="submit" style="background-color: red; color: white; padding: 10px 15px; border: none; cursor: pointer;">
            Delete (წაშლა)
        </button>
    </form>

    <br>
    <a href="{% url 'phone_list' %}">← უკან სიასთან</a>
</body>
</html>
